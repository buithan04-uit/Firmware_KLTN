    ; --- THÊM DÒNG NÀY ĐỂ TĂNG STACK LÊN 32KB ---
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=32768

; --- Môi trường 2 (Giữ nguyên) ---
[env:Max30102]
build_src_filter = -<*.cpp> +<max30102.cpp> 

; --- Môi trường 3 (Giữ nguyên) ---
[env:Mlx90614]
