[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_rts = 0
monitor_dtr = 0

lib_deps =
    gabriel-milan/MAX30100_milan @ ^1.3.0
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    adafruit/Adafruit GFX Library @ ^1.11.5
    adafruit/Adafruit ILI9341 @ ^1.5.12
    adafruit/Adafruit MLX90614 Library @ ^2.1.3
    adafruit/Adafruit ADS1X15 @ ^2.4.0
    adafruit/Adafruit_VL53L0X @ ^1.2.4
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.2

; --- Môi trường 1: Chạy Dự Án Chính ---
[env:Main]
build_src_filter = -<*.cpp> +<main.cpp> +<ad8232.cpp> +<ui_ecg.cpp> +<icons/*.c>
board_build.partitions = huge_app.csv
; --- THÊM PHẦN DƯỚI ĐÂY ---
lib_deps = 
    ${env.lib_deps}    ; Kế thừa thư viện global ở trên
    lvgl/lvgl @ ^8.3.9 ; Thêm thư viện LVGL
    bodmer/TFT_eSPI @ ^2.5.31
    ; Thêm thư viện WifiSecure nếu chưa có trong framework (thường có sẵn)

build_flags = 
    ; Cấu hình cho màn hình (Giữ nguyên cũ)
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=16
    -D TFT_RST=17
    -D SPI_FREQUENCY=27000000
    
    ; CẤU HÌNH CHO LVGL (Sửa lại đoạn này)
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_COMP_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I include  ; <--- QUAN TRỌNG: Đảm bảo trỏ đúng thư mục chứa lv_conf.h
    ; --- THÊM DÒNG NÀY ĐỂ TĂNG STACK LÊN 32KB ---
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=32768
    ; --- Giam log loi lower-level de monitor de doc hon ---
    -D CORE_DEBUG_LEVEL=0
    ; --- TẮT ESP32 ERROR LOGS (fix Wire.cpp error spam cho Munino) ---
    -D CORE_DEBUG_LEVEL=0

[env:Lcd]
board_build.partitions = huge_app.csv
build_src_filter = -<*.cpp> +<boot_screen.cpp> +<lcd.cpp> +<lcd_sensor_runtime.cpp> +<lcd_ui_presenter.cpp> +<ui.cpp> +<ui_datacollector.cpp> +<max30102_sensor_module.cpp> +<mlx90614_sensor_module.cpp> +<ad8232_sensor_module.cpp> +<wifi_config_manager.cpp> +<ad8232.cpp> +<icons/*.c>
monitor_rts = 0
monitor_dtr = 0
; --- THÊM PHẦN DƯỚI ĐÂY ---
lib_deps = 
    ${env.lib_deps}    ; Kế thừa thư viện global ở trên
    lvgl/lvgl @ ^8.3.9 ; Thêm thư viện LVGL
    bodmer/TFT_eSPI @ ^2.5.31
    ; Thêm thư viện WifiSecure nếu chưa có trong framework (thường có sẵn)

